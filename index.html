function parts(){const dl={},mn={},sp={};for(const k in S.days){const d={...S.days[k]};if(d.s)sp[k]=d.s;delete d.s;(d.h?mn:dl)[k]=d}

S=Object.assign({},D,{ts:a.ts,cls:a.cls||D.cls,lvl:a.lvl||D.lvl,op:(p["Opening_Stock.json"]||{}).op||[],opd:(p["Opening_Stock.json"]||{}).opd||D.opd,sch:a.sch||D.sch,cooks:a.cooks??D.cooks,hon:a.hon??D.hon,fuel:a.fuel??D.fuel,rL:b.rL??D.rL,rU:b.rU??D.rU,menus:b.menus||D.menus,N:b.N||D.N,inn:(p["Opening_Stock.json"]||{}).inn||[],mon:p["School_Visit.json"]||{},sup:sf.sup||D.sup,days:Object.assign({},p["Daily_Entries.json"],p["Meal_Not_Cook.json"])});
const bd=sf.byDate||{};for(const k in bd)if(S.days[k])S.days[k].s=bd[k];if(!b.N)mig();else if(!b.nv)fixn();S.nv=2;localStorage.mdm=JSON.stringify(S)}
async function sync(manual){if(busy)return;busy=1;st("sync होत आहे…");
try{const f=await folder(),l=await(await gx(AP+"drive/v3/files?q="+encodeURIComponent(`'${f}' in parents and trashed=false`)+"&fields=files(id,name)")).json(),ids={};l.files.forEach(x=>ids[x.name]=x.id);
let dts=0;if(ids["Profiles.json"])dts=(await(await gx(AP+"drive/v3/files/"+ids["Profiles.json"]+"?alt=media")).json()).ts||0;
if(dts>(S.ts||0)){if(Object.keys(S.days).length&&!confirm("Drive वरील डेटा नवीन आहे. फोनवरील डेटा त्याने बदलायचा?")){st("sync रद्द केले");busy=0;return}
const p={};for(const n in ids)if(n.endsWith(".json"))p[n]=await(await gx(AP+"drive/v3/files/"+ids[n]+"?alt=media")).json();apply(p);st("Drive वरून डेटा घेतला ✔",1);busy=0;return go(T)}
const P=parts();for(const n in P){const body=JSON.stringify(P[n]);if(ids[n])await gx(AP+"upload/drive/v3/files/"+ids[n]+"?uploadType=media",{method:"PATCH",headers:{"Content-Type":"application/json"},body});
else{const fd=new FormData();fd.append("metadata",new Blob([JSON.stringify({name:n,parents:[f],mimeType:"application/json"})],{type:"application/json"}));fd.append("file",new Blob([body],{type:"application/json"}));await gx(AP+"upload/drive/v3/files?uploadType=multipart",{method:"POST",body:fd})}}
st("☁ मोबाईल आणि Drive दोन्हीकडे जतन झाले ✔",1)}catch(e){if(String(e).includes("404")){FID="";localStorage.removeItem("mdmfid2")}st("Drive sync बाकी: "+(e.message||e)+" — मुख्य पानावर 'Drive sync' दाबा",1)}busy=0}
